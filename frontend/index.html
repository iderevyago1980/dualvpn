<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualVPN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- Шапка -->
  <div class="header">
    <div class="logo"><div class="logo-icon">⬡</div> DualVPN</div>
    <span class="mode-pill" id="modePill">…</span>
    <div class="spacer"></div>
    <button class="btn btn-ghost" onclick="switchMode()">↻ Сменить режим</button>
    <button class="btn btn-ghost" onclick="disconnectAll()">Отключить все</button>
    <button class="btn btn-primary" onclick="connectAll()">Подключить все</button>
  </div>

  <!-- Боковая панель: список туннелей строится из конфига (app.js) -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Туннели</div>
      <div id="tunnelList"></div>
    </div>
  </div>

  <!-- Контент выбранного туннеля -->
  <div class="content" id="content">
    <div class="content-header">
      <h1 id="tunnelTitle">—</h1>
      <p id="tunnelSubtitle">Загрузка конфигурации…</p>
    </div>

    <!-- Параметры подключения -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">🔐 Параметры подключения</span>
        <div class="action-bar">
          <button class="btn btn-ghost" onclick="saveConfig()">💾 Сохранить</button>
          <button class="btn-connect off" id="connectBtn" onclick="toggleTunnel()">▶ Подключить</button>
        </div>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-field">
            <label>VPN сервер</label>
            <input type="text" id="fEndpoint">
          </div>
          <div class="form-field">
            <label>Группа (tunnel group)</label>
            <input type="text" id="fGroup" list="groupOptions">
            <datalist id="groupOptions">
              <option value="Group-2FA"></option>
              <option value="Group-Partners-2FA"></option>
              <option value="Basic"></option>
              <option value="Group-Partners"></option>
              <option value="Group-Ext"></option>
              <option value="RA"></option>
              <option value="RA-MFA"></option>
              <option value="RA-Full"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label>Логин</label>
            <input type="text" id="fUser">
          </div>
          <div class="form-field">
            <label>Пароль</label>
            <div class="password-wrapper">
              <input type="password" id="fPass">
              <span class="password-toggle" onclick="togglePass(this)">👁</span>
            </div>
          </div>
          <div class="form-field">
            <label>SOCKS5 порт (no-admin)</label>
            <input type="number" id="fSocks" min="1" max="65535">
          </div>
          <div class="form-field">
            <label>TUN имя (admin)</label>
            <input type="text" id="fTun">
          </div>
        </div>
      </div>
    </div>

    <!-- Маршруты -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">🛣 Маршруты (split-tunneling)</span>
      </div>
      <div class="card-body">
        <div class="routes-list" id="routesList"></div>
      </div>
    </div>

    <!-- Статистика -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📊 Статистика</span>
      </div>
      <div class="card-body">
        <div class="stats-grid">
          <div class="stat-box rx">
            <div class="label">↓ Получено</div>
            <div class="value" id="stRx">—</div>
          </div>
          <div class="stat-box tx">
            <div class="label">↑ Отправлено</div>
            <div class="value" id="stTx">—</div>
          </div>
          <div class="stat-box time">
            <div class="label">⏱ Время</div>
            <div class="value" id="stTime">00:00</div>
          </div>
          <div class="stat-box mode">
            <div class="label">Режим</div>
            <div class="value" id="stMode">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Журнал -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 Журнал</span>
      </div>
      <div class="card-body">
        <div class="log-box" id="logBox"></div>
      </div>
    </div>
  </div>

  <!-- Подвал -->
  <div class="footer">
    <span>v0.1.0</span>
    <span>·</span>
    <span>Config: config.toml</span>
    <span style="flex:1"></span>
    <span id="footerStatus">Загрузка…</span>
  </div>
</div>

<!-- Модальный диалог ввода 2FA-кода (событие tunnel:2fa) -->
<div class="modal-overlay hidden" id="twofaOverlay">
  <div class="modal">
    <h2>Код 2FA</h2>
    <p>Туннель «<span id="twofaTunnel"></span>» запросил второй фактор (TOTP).</p>
    <input type="text" id="twofaCode" maxlength="8" autocomplete="one-time-code" inputmode="numeric">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="hideTwoFA()">Отмена</button>
      <button class="btn btn-primary" onclick="submitTwoFA()">Отправить</button>
    </div>
  </div>
</div>

<!-- Wails runtime: IPC-мост и window.runtime (EventsOn и др.) -->
<script src="/wails/ipc.js"></script>
<script src="/wails/runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
