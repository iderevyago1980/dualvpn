# DualVPN — пример конфигурации.
# Скопируйте в config.toml и заполните username/password (или оставьте пустыми
# для интерактивного ввода).

[mode]
# auto — определить по наличию админ-прав (admin → tun, иначе socks5)
preferred = "auto"  # auto | tun | socks5

# Автонастройка прокси для браузера (только режим socks5). Приложение
# раздаёт proxy.pac по http://127.0.0.1:<port>/proxy.pac; адрес указывается
# в настройках прокси браузера один раз, дальше каждый домен уходит в свой
# туннель по данным шлюза. В TUN-режиме не используется.
[pac]
port = 1088

[[tunnels]]
name = "VPN-1"
endpoint = "vpn1.example.com"
# Имя группы = алиас из списка, который отдаёт сервер (сверено 2026-07-27).
group = "Group-2FA"           # Group-2FA | Group-Partners-2FA | VPN-1 | Partners | Group-Ext
socks_port = 1080
tun_name = "vpn1"
routes = ["192.168.10.0/24", "10.10.0.0/16"]
username = ""
password = ""

[[tunnels]]
name = "VPN-2"
endpoint = "vpn2.example.com"
group = "Remote Access" # Remote Access | Remote Access MFA | Remote Access Full
socks_port = 1081
tun_name = "vpn2"
routes = ["192.168.20.0/24", "10.20.0.0/16"]
username = ""
password = ""
