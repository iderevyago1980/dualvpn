# DualVPN — пример конфигурации.
#
# Этот файл встроен в приложение и разворачивается при первом запуске, если
# файла настроек ещё нет. Адреса серверов ниже — заполнители: подставьте свои
# (в интерфейсе или прямо здесь) перед первым подключением.

[mode]
# auto — определить по наличию админ-прав (admin → tun, иначе socks5)
preferred = "auto"  # auto | tun | socks5

# Автонастройка прокси для браузера (только режим socks5). Приложение
# раздаёт proxy.pac по http://127.0.0.1:<port>/proxy.pac; кнопка «Применить
# прокси» прописывает этот адрес в системные настройки, дальше каждый домен
# уходит в свой туннель по данным шлюза. В TUN-режиме не используется.
[pac]
port = 1088

[[tunnels]]
name = "Туннель 1"
endpoint = "vpn1.example.com"
# Имя группы должно буквально совпадать с алиасом, который отдаёт сервер.
# Список берётся с самого сервера: кнопка «↻ с сервера» рядом с полем группы
# (или dualvpn-harness -groups). Пусто — группа сервера по умолчанию.
group = ""
socks_port = 1080
tun_name = "dualvpn0"
# Подсети для маршрутизации в туннель задаёт шлюз (split-include);
# перечислять их здесь нужно, только если требуется что-то сверх этого.
routes = []
# Пустые логин и пароль означают интерактивный ввод.
username = ""
password = ""

[[tunnels]]
name = "Туннель 2"
endpoint = "vpn2.example.com"
group = ""
socks_port = 1081
tun_name = "dualvpn1"
routes = []
username = ""
password = ""
